# sdist + manylinux wheels → PyPI on a GitHub Release or Actions → Run workflow.
# `uses:` cannot take ${{ matrix.* }}; pin each cibuildwheel version on its own job.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CIBW_SKIP: "*-musllinux_* *t-*"
  CIBW_BEFORE_BUILD: "pip install 'Cython>=3.0'"
  # The manylinux container has none of the X11 dev headers orcsome3_backend.pyx needs; the static
  # libs from `validate`'s native build are relayed in separately (see wheels jobs' download step).
  CIBW_BEFORE_ALL_LINUX: "yum install -y libX11-devel libXext-devel libXScrnSaver-devel libXtst-devel"
  CIBW_ENVIRONMENT: "ORCSOME3_BUILD_JOBS=2"
  CIBW_TEST_SKIP: "*"

jobs:
  validate:
    uses: ./.github/workflows/pr-validation.yml
    permissions:
      contents: read
      pull-requests: write

  wheels-cp39-plus:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Static libs already built by `validate` (native, Linux glibc) — only linking happens here,
      # so no cmake/meson/rust toolchain is needed in this job.
      - uses: actions/download-artifact@v8
        with:
          name: orcsome3-built-libraries
          path: orcsome3_built_libraries

      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp3[9]* cp31*"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-v4.2.0
          path: wheelhouse/*.whl

  wheels-cp38:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Static libs already built by `validate` (native, Linux glibc) — only linking happens here,
      # so no cmake/meson/rust toolchain is needed in this job.
      - uses: actions/download-artifact@v8
        with:
          name: orcsome3-built-libraries
          path: orcsome3_built_libraries

      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp38-*"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-v3.4.1
          path: wheelhouse/*.whl

  build_sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi-publish:
    needs:
      - wheels-cp39-plus
      - wheels-cp38
      - build_sdist
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/orcsome3
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
