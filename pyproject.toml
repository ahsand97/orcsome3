[build-system]
requires = ["setuptools", "wheel", "Cython"]

[project]
name = "orcsome3"
license = {file = "LICENSE"}
authors = [
    {name = "Ahsan Pérez", email = "ahsand.perez@gmail.com"}
]
description = "Scripting extension for NETWM compliant window managers"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Topic :: Desktop Environment :: Window Managers",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
]
dependencies = ["dbus-next", "typing_extensions"]
dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = ["mypy", "basedpyright", "ruff"]

[project.scripts]
orcsome3 = "orcsome3.run:run"

[project.urls]
repository = "https://github.com/ahsand97/orcsome3"

[tool.setuptools]
zip-safe = false
packages = [
    "orcsome3",
    "orcsome3.libs",
    "orcsome3.libs.xlib",
    "orcsome3-stubs",
    "orcsome3-stubs.libs",
    "orcsome3-stubs.libs.xlib",
]

[tool.setuptools.dynamic]
version = {attr = "orcsome3.common.VERSION"}
readme = {file = ["README.rst"], content-type = "text/x-rst"}

[tool.basedpyright]
typeCheckingMode = "all"
reportAny = false
reportExplicitAny = false
reportDeprecated = false
enableTypeIgnoreComments = false

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["orcsome3"]